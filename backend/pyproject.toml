[project]
name = "backend"
version = "0.1.0"
description = "VaultNotice Management Announcement Web Part Backend"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.20.1",
    "fastapi>=0.162.0",
    "psycopg2-binary>=2.9.13",
    "pydantic>=2.0",
    "pydantic-settings>=2.16.2",
    "python-multipart>=0.0.32",
    "reportlab>=5.1.0",
    "sqlalchemy>=2.0",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
